name: Review weekly TMLE papers

on:
  schedule:
    # Monday 00:17 UTC / 08:17 China Standard Time (UTC+8).
    - cron: '17 0 * * 1'
  workflow_dispatch:

# Only the final job can write, using the ephemeral repository GITHUB_TOKEN.
permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: tmle-paper-review
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  discover:
    # Manual runs must also use the trusted default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      base_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Read the previous review branch as data to avoid timestamp-only churn.
          fetch-depth: 0
          persist-credentials: false

      - name: Record the reviewed baseline
        id: baseline
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/tmle-diagnostics"
          git show HEAD:data/semantic_scholar_tmle_papers.json > "$RUNNER_TEMP/tmle-baseline.json"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Discover papers with complete bulk pagination
        run: |
          python3 scripts/fetch_semantic_scholar_papers.py \
            --mode bulk \
            --max-results-per-keyword 0 \
            --request-interval-s 2 \
            --report "$RUNNER_TEMP/tmle-diagnostics/report.json" \
            2>&1 | tee "$RUNNER_TEMP/tmle-diagnostics/fetch.log"

      - name: Record discovery counts and diagnostics
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/generate_tmle_review_summary.py \
            --baseline "$RUNNER_TEMP/tmle-baseline.json" \
            --catalog data/semantic_scholar_tmle_papers.json \
            --report "$RUNNER_TEMP/tmle-diagnostics/report.json" \
            --output-dir "$RUNNER_TEMP/tmle-diagnostics" \
            --run-url "$RUN_URL" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Require complete results and compare catalog content
        id: compare
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path('data/semantic_scholar_tmle_papers.json')
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'tmle-diagnostics/report.json').read_text())
          current = json.loads(path.read_text(encoding='utf-8'))
          if report.get('incomplete') is not False or report.get('query_errors') or report.get('query_truncations'):
              raise SystemExit('Incomplete discovery must never create a review PR.')
          if current.get('incomplete') is not False:
              raise SystemExit('The generated catalog is incomplete.')
          baseline_bytes = subprocess.check_output(['git', 'show', f'HEAD:{path}'])
          baseline = json.loads(baseline_bytes)

          def content(catalog):
              if not isinstance(catalog.get('papers'), list) or not isinstance(catalog.get('keywords'), list):
                  raise ValueError('Catalog must contain papers and keywords lists.')
              return catalog['papers'], catalog['keywords']

          changed = content(current) != content(baseline)
          previous = subprocess.run(
              ['git', 'show', f'refs/remotes/origin/automation/tmle-papers:{path}'],
              capture_output=True, check=False,
          )
          stale_proposal = False
          if not changed:
              # Fresh run metadata stays in the artifact, not in a timestamp-only commit.
              path.write_bytes(baseline_bytes)
              if previous.returncode == 0:
                  try:
                      stale_proposal = content(json.loads(previous.stdout)) != content(baseline)
                  except (ValueError, TypeError):
                      stale_proposal = True
          else:
              if previous.returncode == 0:
                  try:
                      prior = json.loads(previous.stdout)
                      if isinstance(prior, dict) and prior.get('incomplete') is False and content(prior) == content(current):
                          path.write_bytes(previous.stdout)
                  except (ValueError, TypeError):
                      pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'changed={str(changed).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\nCatalog changes require review.\n' if changed else
                           '\nNo paper or keyword changes; rendering and the review PR are skipped.\n')
          if stale_proposal:
              warning = ('The existing automation/tmle-papers branch differs from the now-current catalog. '
                         'Any open review PR may be obsolete, including papers since blocklisted on the default '
                         'branch. This run leaves it unchanged; review it against the current default branch '
                         'before merging or close it manually.')
              print('::warning::' + warning)
              for destination in (Path(os.environ['GITHUB_STEP_SUMMARY']),
                                  Path(os.environ['RUNNER_TEMP']) / 'tmle-diagnostics/review-summary.md'):
                  with destination.open('a', encoding='utf-8') as output:
                      output.write('\n**Existing proposal needs review:** ' + warning + '\n')
          PY

      - name: Set up pinned Quarto
        if: steps.compare.outputs.changed == 'true'
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: '1.6.42'

      - name: Generate and render the TMLE page
        if: steps.compare.outputs.changed == 'true'
        run: |
          python3 scripts/generate_tmle_papers_qmd.py \
            2>&1 | tee "$RUNNER_TEMP/tmle-diagnostics/generate.log"
          quarto render tmle-papers.qmd \
            2>&1 | tee "$RUNNER_TEMP/tmle-diagnostics/render.log"

      - name: Package only approved generated files
        if: steps.compare.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          required = {'data/semantic_scholar_tmle_papers.json', 'tmle-papers.qmd',
                      'docs/tmle-papers.html', 'docs/search.json'}

          def allowed(name):
              path = Path(name)
              return name in required or (name.startswith('docs/site_libs/') and path.suffix == '.css')

          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0'))
          changed.update(subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode().split('\0'))
          unexpected = sorted(name for name in changed if name and not allowed(name))
          if unexpected:
              raise SystemExit(f'Render changed files outside the generated allowlist: {unexpected}')
          files = required | {str(path) for path in Path('docs/site_libs').rglob('*.css')}
          output = Path(os.environ['RUNNER_TEMP']) / 'tmle-review'
          for name in sorted(files):
              source = Path(name)
              if not source.is_file() or source.is_symlink():
                  raise SystemExit(f'Expected a regular generated file: {name}')
              target = output / 'payload' / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          shutil.copyfile(Path(os.environ['RUNNER_TEMP']) / 'tmle-diagnostics/review-summary.md',
                          output / 'review-summary.md')
          PY

      - name: Preserve discovery and render diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmle-discovery-diagnostics
          path: ${{ runner.temp }}/tmle-diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload review files
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmle-review-files
          path: ${{ runner.temp }}/tmle-review/
          if-no-files-found: error
          retention-days: 30

  review-pr:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reject a stale build
        env:
          EXPECTED_SHA: ${{ needs.discover.outputs.base_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo 'The default branch changed during discovery. Rerun this workflow against its new contents.' >&2
            exit 1
          fi

      - name: Download this run's review files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tmle-review-files
          path: ${{ runner.temp }}/tmle-review
          digest-mismatch: error

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore allowlisted generated files only
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source = Path(os.environ['RUNNER_TEMP']) / 'tmle-review/payload'
          required = {'data/semantic_scholar_tmle_papers.json', 'tmle-papers.qmd',
                      'docs/tmle-papers.html', 'docs/search.json'}
          found = set()
          for path in source.rglob('*'):
              if path.is_symlink():
                  raise SystemExit('Generated artifacts must not contain symlinks.')
              if path.is_dir():
                  continue
              name = path.relative_to(source).as_posix()
              if name not in required and not (name.startswith('docs/site_libs/') and path.suffix == '.css'):
                  raise SystemExit(f'Unexpected artifact file: {name}')
              found.add(name)
          if not required <= found:
              raise SystemExit('The generated artifact is missing required files.')
          for name in sorted(found):
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source / name, target)
          PY

      - name: Open or update the draft review PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/tmle-papers
          base: ${{ github.event.repository.default_branch }}
          draft: always-true
          delete-branch: false
          title: 'Review discovered TMLE papers'
          commit-message: 'Refresh TMLE paper catalog for review'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          body-path: ${{ runner.temp }}/tmle-review/review-summary.md
          add-paths: |
            data/semantic_scholar_tmle_papers.json
            tmle-papers.qmd
            docs/tmle-papers.html
            docs/search.json
            docs/site_libs/**/*.css

      - name: Link the review PR
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [[ -n "$PR_URL" ]]; then
            printf '\nDraft review PR: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
